version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - exhaustive
    - ineffassign
    - misspell
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G402: TLS InsecureSkipVerify is intentional for an intercepting proxy.
        - G402
        # G404: non-crypto rand is acceptable for jitter/labels, not secrets.
        - G404
  exclusions:
    generated: lax
    presets:
      # Restores the v1 default of not flagging fmt.*/bytes.Buffer writes etc.
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
