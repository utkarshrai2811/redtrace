name: Feature request
description: Suggest an idea or capability for RedTrace
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that RedTrace makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: burp
    attributes:
      label: Burp Suite comparison
      description: Does Burp (or another tool) offer this? How does it work there?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
